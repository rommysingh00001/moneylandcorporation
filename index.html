<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="supabase.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   GLOBAL & LAYOUT STYLES (Preserving your font structure)
   ========================================================================== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  scroll-behavior: smooth;
}

body {
  font-family: 'Poppins', sans-serif;
  background: #09080e; /* Exact screenshot deep background */
  color: #fff;
  overflow-x: hidden;
}

/* =========================
   HEADER (Premium Layout update)
   ========================= */
header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  padding: 20px 50px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(13, 11, 20, 0.92);
  backdrop-filter: blur(14px);
  z-index: 1000;
  transition: 0.4s ease;
  border-bottom: 1px solid #1f1a2e;
}

header.sticky {
  padding: 14px 50px;
  background: #0d0b14;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
}

.logo-box {
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
}

.logo-icon {
  color: #a855f7;
  font-size: 22px;
}

.logo-text h2 {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 1px;
}

nav {
  display: flex;
  align-items: center;
  gap: 28px;
}

nav a {
  position: relative;
  font-size: 14px;
  font-weight: 500;
  color: #9ca3af;
  text-decoration: none;
  transition: 0.3s ease;
}

nav a.active, nav a:hover {
  color: #a855f7;
}

nav a::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -6px;
  width: 0%;
  height: 2px;
  background: #a855f7;
  transition: 0.3s ease;
}

nav a.active::after, nav a:hover::after {
  width: 100%;
}

.nav-right-actions {
  display: flex;
  align-items: center;
  gap: 20px;
}

.action-icon {
  background: none;
  border: none;
  color: #9ca3af;
  font-size: 18px;
  cursor: pointer;
  transition: 0.2s;
}

.action-icon:hover {
  color: #fff;
}

.profile-avatar {
  width: 32px;
  height: 32px;
  background-color: #3b2e5c;
  border: 1px solid #a855f7;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: bold;
}

/* =========================
   HERO & SEARCH FEED SECTION (Updated for exact purple aura)
   ========================= */
.hero {
  padding-top: 140px;
  padding-bottom: 50px;
  background: linear-gradient(to right, #170e2b, #0d071a, #1c0f35);
  border-bottom: 1px solid #1f1a2e;
  text-align: center;
}

.hero-content {
  max-width: 900px;
  margin: 0 auto;
  padding: 0 20px;
  animation: fadeUp 1.2s ease;
}

.hero-content h1 {
  font-size: 38px;
  font-weight: 700;
  margin-bottom: 6px;
  letter-spacing: -0.5px;
}

.hero-content p {
  font-size: 14px;
  color: #9ca3af;
  margin-bottom: 25px;
}

.hero-content p span {
  color: #a855f7;
  font-weight: 600;
}

/* Search Bar Update */
.search-bar {
  background: #120e1f;
  padding: 8px;
  border-radius: 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  border: 1px solid #2b2244;
  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
}

.search-input-wrapper {
  flex: 1;
  min-width: 280px;
  background: #1a142e;
  border-radius: 8px;
  padding: 10px 15px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.search-input-wrapper input {
  background: transparent;
  border: none;
  outline: none;
  color: #fff;
  font-size: 14px;
  width: 100%;
}

.search-input-wrapper input::placeholder {
  color: #6b7280;
}

.filter-group {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.search-bar select {
  background: #1a142e;
  border: 1px solid #2b2244;
  color: #d1d5db;
  font-size: 13px;
  padding: 10px 15px;
  border-radius: 8px;
  outline: none;
  cursor: pointer;
}

.search-bar button {
  background: #a855f7;
  color: #fff;
  font-weight: 700;
  padding: 10px 24px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  white-space: nowrap;
  transition: 0.2s;
}

.search-bar button:hover {
  background: #9333ea;
  transform: none;
}

/* ==========================================================================
   MAIN DASHBOARD GRID LAYOUT (3 columns mimicking image)
   ========================================================================== */
.dashboard-container {
  max-width: 1340px;
  margin: 0 auto;
  padding: 40px 20px;
  display: grid;
  grid-template-columns: 2.5fr 6.5fr 3fr;
  gap: 25px;
}

.panel-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  color: #6b7280;
  letter-spacing: 1px;
  margin-bottom: 20px;
}

/* --- COLUMN 1: TRENDING FEED REELS --- */
.feed-card {
  background: #0f0d18;
  border: 1px solid #1f1a2e;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 16px;
  cursor: pointer;
}

.feed-thumb {
  height: 110px;
  background: #252033;
  border-radius: 8px;
  margin-bottom: 10px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.play-badge {
  font-size: 18px;
  background: rgba(0,0,0,0.5);
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.feed-info h4 {
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.feed-info p {
  font-size: 11px;
  color: #6b7280;
  margin-top: 2px;
}

/* --- COLUMN 2: PROPERTY LISTINGS --- */
.listings-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.listings-header h3 {
  font-size: 18px;
  font-weight: 700;
}

.matched-badge {
  font-size: 11px;
  color: #9ca3af;
  background: #120e24;
  border: 1px solid #231b3a;
  padding: 4px 10px;
  border-radius: 4px;
}

.property-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}

.property-card {
  background: #0e0c15;
  border: 1px solid #211a33;
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: 0.3s;
}

.property-card:hover {
  border-color: #a855f7;
  transform: none;
  box-shadow: none;
}

.card-img-slot {
  height: 150px;
  background: #1a162b;
  position: relative;
}

.verified-tag {
  position: absolute;
  top: 10px;
  left: 10px;
  background: #a855f7;
  font-size: 9px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 4px;
}

.card-body {
  padding: 16px;
}

.card-body h4 {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 4px;
}

.card-body .loc {
  font-size: 12px;
  color: #9ca3af;
  margin-bottom: 8px;
}

.card-body .price {
  font-size: 18px;
  font-weight: 700;
  color: #a855f7;
  margin-bottom: 8px;
}

.card-body .specs {
  font-size: 11px;
  color: #9ca3af;
  background: #151124;
  border: 1px solid #201936;
  padding: 6px;
  border-radius: 6px;
}

.card-footer {
  padding: 12px 16px;
  border-top: 1px solid #1a142b;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
}

.time-text {
  color: #6b7280;
}

.action-btn {
  background: none;
  border: none;
  color: #a855f7;
  font-weight: 700;
  cursor: pointer;
}

/* --- COLUMN 3: PREMIUM MEMBERSHIP CARD --- */
.membership-panel {
  background: linear-gradient(to bottom, #241246, #0f0920);
  border: 2px solid #a855f7;
  border-radius: 16px;
  padding: 24px;
  text-align: center;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
}

.crown {
  font-size: 26px;
  margin-bottom: 6px;
}

.membership-panel h4 {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.membership-panel h2 {
  font-size: 22px;
  font-weight: 700;
  margin: 8px 0;
}

.zero-broker-badge {
  font-size: 10px;
  font-weight: 700;
  color: #a855f7;
  margin-bottom: 12px;
}

.membership-panel p {
  font-size: 12px;
  color: #9ca3af;
  margin-bottom: 20px;
}

.join-now-btn {
  width: 100%;
  background: #a855f7;
  color: #fff;
  border: none;
  padding: 12px;
  border-radius: 8px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  margin-bottom: 20px;
  transition: 0.2s;
}

.join-now-btn:hover {
  background: #9333ea;
}

.benefits-box {
  text-align: left;
  border-top: 1px solid #2b1c4b;
  padding-top: 15px;
}

.benefits-box h5 {
  font-size: 11px;
  color: #6b7280;
  margin-bottom: 10px;
}

.benefit-line {
  font-size: 12px;
  color: #d1d5db;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.check-mark {
  color: #a855f7;
}

/* =========================
   ANIMATIONS & RESPONSIVE
   ========================= */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@media(max-width: 1024px) {
  .dashboard-container {
    grid-template-columns: 1fr;
  }
  header {
    padding: 20px 30px;
  }
}
@media(max-width: 600px) {
  .search-bar {
    flex-direction: column;
  }
  .search-input-wrapper, .filter-group, .search-bar button {
    width: 100%;
  }
}
</style>
</head>
<body>

  <!-- ========================= HEADER ========================= -->
  <header id="mainHeader">
    <div class="logo-box">
      <span class="logo-icon">◆</span>
      <div class="logo-text">
        <h2>MONEYLAND</h2>
      </div>
    </div>
    
    <nav>
      <a href="#" class="active">New Booking</a>
      <a href="#">Resale</a>
      <a href="#">Commercial</a>
      <a href="#">Residential</a>
      <a href="#">Plots</a>
      <a href="#">Villa</a>
      <a href="#">Farm</a>
    </nav>

    <div class="nav-right-actions">
      <button class="action-icon">❤️</button>
