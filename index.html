<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moneyland - Gurgaon Property Feed</title>
  
  <!-- Supabase Scripts -->
  <script src="https://jsdelivr.net"></script>
  <script src="supabase.js"></script>
  
  <!-- External Google Fonts -->
  <link href="https://googleapis.com" rel="stylesheet">

  <style>
    /* ==========================================================================
       GLOBAL RESET & THEMING
       ========================================================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #09080e;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* ==========================================================================
       1. NAVIGATION BAR
       ========================================================================== */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(13, 11, 20, 0.95);
      backdrop-filter: blur(14px);
      z-index: 1000;
      transition: 0.4s ease;
      border-bottom: 1px solid #1f1a2e;
    }

    header.sticky {
      padding: 14px 50px;
      background: #0d0b14;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .logo-box {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .logo-icon {
      color: #a855f7;
      font-size: 22px;
      text-shadow: 0 0 10px rgba(168, 85, 247, 0.6);
    }

    .logo-text h2 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    nav a {
      position: relative;
      font-size: 14px;
      font-weight: 500;
      color: #9ca3af;
      text-decoration: none;
      transition: 0.3s ease;
    }

    nav a.active, nav a:hover {
      color: #a855f7;
    }

    nav a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -6px;
      width: 0%;
      height: 2px;
      background: #a855f7;
      transition: 0.3s ease;
    }

    nav a.active::after, nav a:hover::after {
      width: 100%;
    }

    .nav-right-actions {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .action-icon {
      background: none;
      border: none;
      color: #9ca3af;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s;
    }

    .action-icon:hover {
      color: #fff;
    }

    .profile-avatar {
      width: 34px;
      height: 34px;
      background-color: #3b2e5c;
      border: 1px solid #a855f7;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    /* ==========================================================================
       2. HERO & FEED FILTERS
       ========================================================================== */
    .hero {
      padding-top: 130px;
      padding-bottom: 45px;
      background: linear-gradient(to bottom, #170e2b, #0d071a, #09080e);
      border-bottom: 1px solid #1f1a2e;
      text-align: center;
      position: relative;
    }

    .hero-content {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 20px;
      animation: fadeUp 1s ease;
    }

    .hero-content h1 {
      font-size: 38px;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .hero-content p {
      font-size: 14px;
      color: #9ca3af;
      margin-bottom: 30px;
    }

    .hero-content p span {
      color: #a855f7;
      font-weight: 600;
    }

    .search-bar {
      background: #120e1f;
      padding: 10px;
      border-radius: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      border: 1px solid #2b2244;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.6);
    }

    .search-input-wrapper {
      flex: 1;
      min-width: 320px;
      background: #1a142e;
      border-radius: 8px;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-input-wrapper input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 14px;
      width: 100%;
    }

    .search-input-wrapper input::placeholder {
      color: #6b7280;
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .search-bar select {
      background: #1a142e;
      border: 1px solid #2b2244;
      color: #d1d5db;
      font-size: 13px;
      padding: 12px 16px;
      border-radius: 8px;
      outline: none;
      cursor: pointer;
    }

    .search-bar button {
      background: #a855f7;
      color: #fff;
      font-weight: 700;
      padding: 12px 26px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.2s;
    }

    .search-bar button:hover {
      background: #9333ea;
    }

    /* ==========================================================================
       3. DASHBOARD MAIN 3-COLUMN LAYOUT
       ========================================================================== */
    .dashboard-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 20px;
      display: grid;
      grid-template-columns: 2.8fr 6.4fr 2.8fr;
      gap: 25px;
    }

    .panel-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #6b7280;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    /* COLUMN 1: PROPERTY VISUAL REELS */
    .feed-card {
      background: #0e0c15;
      border: 1px solid #1f1a2e;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
      cursor: pointer;
      transition: border-color 0.3s;
    }

    .feed-card:hover {
      border-color: #a855f7;
    }

    .feed-thumb {
      height: 120px;
      background: #1a1528;
      border-radius: 8px;
      margin-bottom: 10px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-badge {
      font-size: 16px;
      background: rgba(168, 85, 247, 0.7);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
    }

    .feed-info h4 {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .feed-info p {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 2px;
    }

    /* COLUMN 2: VERIFIED LISTINGS FEED */
    .listings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .listings-header h3 {
      font-size: 20px;
      font-weight: 700;
    }

    .matched-badge {
      font-size: 11px;
      color: #a855f7;
      background: #120e24;
      border: 1px solid #231b3a;
      padding: 4px 12px;
      border-radius: 6px;
      font-weight: 600;
    }

    .property-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 20px;
    }

    .property-card {
      background: #0e0c15;
      border: 1px solid #211a33;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: 0.3s ease;
    }

    .property-card:hover {
      border-color: #a855f7;
      box-shadow: 0 10px 25px rgba(168, 85, 247, 0.15);
    }

    .card-img-slot {
      height: 160px;
      background: #1c1830;
      position: relative;
    }

    .verified-tag {
      position: absolute;
      top: 12px;
      left: 12px;
      background: #a855f7;
      font-size: 9px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    .card-body {
      padding: 18px;
    }

    .card-body h4 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 5px;
      color: #ffffff;
    }

    .card-body .loc {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 10px;
    }

    .card-body .price {
      font-size: 19px;
      font-weight: 700;
      color: #a855f7;
      margin-bottom: 12px;
    }

    .card-body .specs {
      font-size: 11px;
      color: #d1d5db;
      background: #151124;
      border: 1px solid #201936;
      padding: 8px;
      border-radius: 6px;
      line-height: 1.4;
    }

    .card-footer {
      padding: 14px 18px;
      border-top: 1px solid #1a142b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }

    .time-text {
      color: #6b7280;
    }

    .action-btn {
      background: none;
      border: none;
      color: #a855f7;
      font-weight: 700;
      cursor: pointer;
      font-size: 12px;
    }

    .action-btn:hover {
      text-decoration: underline;
    }

    /* COLUMN 3: EXCLUSIVE DEALS PANEL */
    .membership-panel {
      background: linear-gradient(to bottom, #241246, #0f0920);
      border: 2px solid #a855f7;
      border-radius: 16px;
      padding: 26px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
    }

    .crown {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .membership-panel h4 {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
